<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/calc.css">
    <title>Calculadora</title>
</head>
<body>

    <div class="calculadora">

        <div class="head">
            <label id="calculadora_data">
                0
            </label>
        </div>
        <div class="body">
            <button onclick="clear_one()">
                C
            </button>
            <button onclick="addNumber(1)">
                1
            </button>
            <button onclick="addNumber(2)">
                2
            </button>
            <button onclick="addNumber(3)">
                3
            </button>
            <button onclick="addNumber(4)">
                4
            </button>
            <button onclick="addNumber(5)">
                5
            </button>
            <button onclick="addNumber(6)">
                6
            </button>
             <button onclick="addNumber(7)">
                7
            </button>
            <button onclick="addNumber(8)">
                8
            </button>
             <button onclick="addNumber(9)">
                9
            </button>
            <button onclick="addNumber(0)">
                0
            </button>
            <button onclick="setOperation('+')">
                +
            </button>
            <button onclick="setOperation('=')">
                =
            </button>
            <button onclick="setOperation('*')">
                *
            </button>
            <button onclick="setOperation('.')">
                .
            </button>
            <button onclick="setOperation('/')">
                /
            </button>
               
            <button onclick="setOperation('-')">
                -
            </button>
            <button onclick="_clear()">
                CE
            </button>
        </div>

    </div>
    
</body>

<script>


    const numeros = [];
    const operadores = ["+","-","/","*","%"];
    
    
    var ope = "";

    function _clear(){
        let data = document.getElementById("calculadora_data")
        numeros.length = 0;
        
        data.innerHTML = "0";
        ope = "";

    }

    function clear_one(){
        let data = document.getElementById("calculadora_data")
        numeros.pop();
        data.innerHTML = numeros.join("");
    }

    function addNumber(value){

        numeros.push(value);

        let data = document.getElementById("calculadora_data");
       
        data.innerHTML = numeros.join("");
       
    }

    function setOperation(_ope){
       

        let data = document.getElementById("calculadora_data");
        let posicion;
        let operador;
        let resultado=0;
        let posiciones = [];
        let operadoresEncontrados = [];
       
       
        if(_ope === "="){


            //esta cosa para buscar

            for(let i =0; i<numeros.length; i++){
                
                if(operadores.includes(numeros[i])){
                    posiciones.push(i);
                    operadoresEncontrados.push(numeros[i]);
                    
                }
            }

            //aca a dividir
            let indicePrioridad = -1;

            for (let i = 0; i < operadoresEncontrados.length; i++) {
                if (
                    operadoresEncontrados[i] === "*" ||
                    operadoresEncontrados[i] === "/" ||
                    operadoresEncontrados[i] === "%"
                ) {
                    indicePrioridad = i;
                    break;
                }
            }


            if (indicePrioridad !== -1) {
                let posicionReal = posiciones[indicePrioridad];

                


                let inicio = posicionReal - 1;

                while (inicio >= 0 && !operadores.includes(numeros[inicio])) {
                    inicio--;
                }

                let fin = posicionReal + 1;

                while (fin < numeros.length && !operadores.includes(numeros[fin])) {
                    fin++;
                }

                let parteIzquierda = numeros.slice(inicio + 1, posicionReal);
                let parteDerecha = numeros.slice(posicionReal + 1, fin);

                
                let num1 = parseInt(parteIzquierda.join(""));
                let num2 = parseInt(parteDerecha.join(""));


                operador = numeros[posicionReal];
                //aaca c hacer
                switch (operador) {
                    case "+":
                        resultado = num1 + num2;
                        break;
        
                    case "-":
                        resultado =num1 - num2;
                        break;
        
                    case "*":
                        resultado =num1 * num2;
                        break;
        
                    case "/":
                    resultado =num1 / num2;
                        break;
                }

                numeros.splice(
                    inicio + 1,
                    fin - (inicio + 1),
                    String(resultado)
                );

                data.innerHTML = numeros.join("");
                //data.innerHTML = resultado;

            }else if (operadoresEncontrados.length > 0) {
             let posicionReal = posiciones[0];




            }else{
                numeros.push(_ope);
                
                data.innerHTML = numeros.join("");
                
                
            }
    }   
        
       

        
        //indeOf es clave

        
        //let signo = numeros[posicion];

        
       
    }
</script>
</html>
