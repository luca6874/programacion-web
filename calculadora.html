<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/calc.css">
    <title>Calculadora</title>
</head>
<body>

    <div class="calculadora">

        <div class="head">
            <label id="calculadora_data">
                0
            </label>
        </div>
        <div class="body">
            <button onclick="clear_one()">
                C
            </button>
            <button onclick="addNumber(1)">
                1
            </button>
            <button onclick="addNumber(2)">
                2
            </button>
            <button onclick="addNumber(3)">
                3
            </button>
            <button onclick="addNumber(4)">
                4
            </button>
            <button onclick="addNumber(5)">
                5
            </button>
            <button onclick="addNumber(6)">
                6
            </button>
             <button onclick="addNumber(7)">
                7
            </button>
            <button onclick="addNumber(8)">
                8
            </button>
             <button onclick="addNumber(9)">
                9
            </button>
            <button onclick="addNumber(0)">
                0
            </button>
            <button onclick="setOperation('+')">
                +
            </button>
            <button onclick="setOperation('=')">
                =
            </button>
            <button onclick="setOperation('*')">
                *
            </button>
            <button onclick="setOperation('.')">
                .
            </button>
            <button onclick="setOperation('/')">
                /
            </button>
               
            <button onclick="setOperation('-')">
                -
            </button>
            <button onclick="_clear()">
                CE
            </button>
        </div>

    </div>
    
</body>

<script>


    const numeros = [];
    const operadores = ["+","-","/","*","%"];
    
    var ope = "";

    function _clear(){
        let data = document.getElementById("calculadora_data")
        numeros.length = 0;
        
        data.innerHTML = "0";
        ope = "";

    }

    function clear_one(){
        let data = document.getElementById("calculadora_data")
        numeros.pop();
        data.innerHTML = numeros.join("");
    }

    function addNumber(value){

        numeros.push(value);

        let data = document.getElementById("calculadora_data");
       
        data.innerHTML = numeros.join("");
       
    }

    function setOperation(_ope){
       

        let data = document.getElementById("calculadora_data");
        let posicion;
        let operador;
        let resultado=0;

       
        if(_ope === "="){

            for(let i =0; i<numeros.length; i++){
                
                if(operadores.includes(numeros[i])){
                    posicion = i;
                    operador = numeros[i];
                    
                    break;
                }
            }
            let parte1 = numeros.slice(0,posicion);
            let parte2 = numeros.slice(posicion+1);
    
            let num1 = parseInt(parte1.join(""));
            let num2 = parseInt(parte2.join(""));

            switch (operador) {
                case "+":
                    resultado = num1 + num2;
                    break;
    
                case "-":
                    resultado =num1 - num2;
                    break;
    
                case "*":
                    resultado =num1 * num2;
                    break;
    
                case "/":
                   resultado =num1 / num2;
                    break;
            }

            data.innerHTML = resultado;
        }else{
            numeros.push(_ope);
            
            data.innerHTML = numeros.join("");

            
        }

       
        
                
        

        



        
        //indeOf es clave

        
        //let signo = numeros[posicion];

        
       
    }
</script>
</html>
